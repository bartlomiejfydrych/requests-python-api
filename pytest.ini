[pytest]

; dodaje katalog src do sys.path, żeby działały importy typu
; "from configuration..." / "from tests.base.test_base import TestBase"
; bez ręcznego ustawiania PYTHONPATH (wymaga pytest >= 7.0)
pythonpath = src

; pozwala odpalić po prostu "pytest" z roota, bez podawania ścieżki do testów
testpaths = src/tests

markers =
    flaky: testy niestabilne, które mogą czasem failować bez zmian w kodzie
    positive: scenariusze pozytywne (happy path)
    negative: scenariusze negatywne (błędne dane, brak autoryzacji, walidacje itd.)
    unit: testy jednostkowe funkcji pomocniczych (utils), nieużywające żadnych wywołań HTTP

; jeśli użyjesz markera, który nie jest zarejestrowany powyżej (np. literówka),
; pytest zgłosi błąd przy starcie zamiast po cichu zignorować marker
;
; NOTE FOR ME:
; Katalog wynikowy dla Allure (odpowiednik Javowego {allure.properties} /
; {allure.results.directory=target/allure-results}) NIE jest ustawiany tutaj przez {--alluredir}, bo to
; ścieżka względna - byłaby rozwiązywana względem {cwd} procesu (inny przy odpaleniu z konsoli, inny przy
; odpaleniu pojedynczej klasy z IDE), co dawało losowe lokalizacje katalogu.
; Zamiast tego jest on wymuszany programowo, jako ścieżka bezwzględna, w hooku {pytest_configure}
; w root-owym {conftest.py} (tam też, warunkowo w {pytest_sessionstart}, jest czyszczony - odpowiednik
; {GlobalTestExecutionListener}).
addopts = --strict-markers -m "not unit"